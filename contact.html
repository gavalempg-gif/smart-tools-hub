<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - Smart Tools Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:30px 20px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:10px;
}

.container{
    width:92%;
    max-width:700px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
    color:#2563eb;
    margin-bottom:15px;
}

.card p{
    line-height:1.7;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.home-btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
    margin-top:10px;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>Smart Tools Hub</p>
</header>

<div class="container">

    <div class="card">
        <h2>Get in Touch</h2>

        <p>
            If you have any questions, suggestions, feedback or
            issues regarding Smart Tools Hub, you can contact us.
        </p>

        <p>
            We appreciate your feedback and suggestions for improving
            our calculators and online tools.
        </p>
    </div>

    <div class="card">

        <h2>Contact Form</h2>

        <form action="mailto:gavalempg@gmail.com"
              method="post"
              enctype="text/plain">

            <label for="name">Name</label>
            <input type="text" id="name" name="Name"
                   placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="Email"
                   placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" name="Message"
                      placeholder="Write your message"
                      required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

    <div class="card">
        <a class="home-btn" href="index.html">🏠 Back to Home</a>
    </div>

</div>

<footer>
    <p>© 2026 Smart Tools Hub</p>
</footer>

</body>
</html>
