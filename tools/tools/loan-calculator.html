DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Calculator - Smart Tools Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#111}
.container{max-width:900px;margin:20px auto;padding:15px}.card{background:#fff;border-radius:22px;padding:25px;box-shadow:0 8px 28px rgba(0,0,0,.1)}
h1{text-align:center;color:#2864dc;font-size:36px;margin:5px 0 25px}
label{display:block;font-size:20px;font-weight:700;margin:18px 0 8px}
input{width:100%;padding:16px;border:2px solid #ddd;border-radius:14px;font-size:20px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#2864dc;color:#fff}
.reset{background:#777}.csv{background:#168a55}.print{background:#8a4fd3}.toggle{display:block;margin:auto;background:#222;font-size:15px;padding:10px 15px}
.result{margin-top:25px;background:#eef8f3;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{background:#fff;border-radius:14px;padding:15px;text-align:center;border:1px solid #ddd}.title{font-weight:700}.value{font-size:22px;font-weight:800;margin-top:8px;color:#176b45}
.schedule{margin-top:25px;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border:1px solid #ddd;text-align:right}th{background:#2864dc;color:white}td:first-child,th:first-child{text-align:center}
body.dark{background:#121722;color:#eee}body.dark .card,body.dark input,body.dark .box{background:#1c2433;color:#eee}body.dark input{border-color:#475267}body.dark .result{background:#173326}
@media(max-width:700px){.container{padding:10px}.card{padding:18px}h1{font-size:30px}.grid,.buttons{grid-template-columns:1fr}}
@media print{.toggle,.buttons{display:none}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="container"><div class="card">
<button class="toggle" onclick="toggleDark()">🌙 Dark / ☀️ Light</button>
<h1>🏦 Loan Calculator</h1>

<label>Loan Amount (₹)</label>
<input id="amount" type="number" min="0" step="1000" value="1000000">

<label>Interest Rate (% per year)</label>
<input id="rate" type="number" min="0" step="0.01" value="8">

<label>Loan Tenure (Years)</label>
<input id="years" type="number" min="1" step="1" value="10">

<div class="buttons">
<button onclick="calculateLoan()">💰 Calculate EMI</button>
<button class="reset" onclick="resetLoan()">🔄 Reset</button>
<button class="csv" onclick="downloadCSV()">📥 Download CSV</button>
<button class="print" onclick="window.print()">🖨️ Print / PDF</button>
</div>

<div id="result" class="result" style="display:none">
<div class="grid">
<div class="box"><div class="title">💰 Monthly EMI</div><div id="emi" class="value">₹0</div></div>
<div class="box"><div class="title">💵 Total Payment</div><div id="totalPayment" class="value">₹0</div></div>
<div class="box"><div class="title">📈 Total Interest</div><div id="totalInterest" class="value">₹0</div></div>
</div>
<div class="schedule"><h2>📋 Amortization Schedule</h2>
<table><thead><tr><th>Month</th><th>EMI</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
<tbody id="scheduleBody"></tbody></table></div>
</div>
</div></div>

<script>
let scheduleData=[];
function money(n){return "₹ "+Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function calculateLoan(){
 const P=parseFloat(document.getElementById("amount").value);
 const annualRate=parseFloat(document.getElementById("rate").value);
 const years=parseFloat(document.getElementById("years").value);
 if(!P||P<=0||annualRate<0||!years||years<=0){alert("Please enter valid Loan Amount, Interest Rate and Tenure.");return}
 const n=Math.round(years*12),r=annualRate/12/100;
 const baseEmi=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
 let balance=P,totalInterest=0;scheduleData=[];
 for(let month=1;month<=n;month++){
   let interest=r===0?0:balance*r,principal=baseEmi-interest,actualEmi=baseEmi;
   if(month===n||principal>balance){principal=balance;actualEmi=principal+interest}
   balance-=principal;if(balance<0.01)balance=0;
   totalInterest+=interest;
   scheduleData.push({month,emi:actualEmi,principal,interest,balance});
 }
 document.getElementById("emi").textContent=money(scheduleData[0].emi);
 document.getElementById("totalPayment").textContent=money(P+totalInterest);
 document.getElementById("totalInterest").textContent=money(totalInterest);
 document.getElementById("result").style.display="block";
 document.getElementById("scheduleBody").innerHTML=scheduleData.map(r=>`<tr><td>${r.month}</td><td>${money(r.emi)}</td><td>${money(r.principal)}</td><td>${money(r.interest)}</td><td>${money(r.balance)}</td></tr>`).join("");
}
function resetLoan(){document.getElementById("amount").value=1000000;document.getElementById("rate").value=8;document.getElementById("years").value=10;document.getElementById("result").style.display="none";scheduleData=[]}
function downloadCSV(){
 if(!scheduleData.length){alert("First calculate the loan.");return}
 let csv="Month,EMI,Principal,Interest,Balance\n";
 scheduleData.forEach(r=>csv+=`${r.month},${r.emi.toFixed(2)},${r.principal.toFixed(2)},${r.interest.toFixed(2)},${r.balance.toFixed(2)}\n`);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="loan-amortization-schedule.csv";a.click();
}
function toggleDark(){document.body.classList.toggle("dark")}
</script>
</body>
</html>
